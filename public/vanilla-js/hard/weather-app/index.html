<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="styles.css">
  <title>Document</title>
</head>
<body>

  <main class="container">
    <div class="card">
      <div class="header">
        <h1>Weather App <img src="/JavaScript_logo.png" alt="JS Icon" height="24" width="24" title="Made in Vanilla HTML/CSS/JS"></h1>
        <p>Check the weather in your city!</p>
      </div>

      <div class="wrapper">
        <div>
          <div class="searchWrapper">
            <label for="cityInput">City</label>
            <input list="cityNameOptions" id="cityInput" name="cityName" type="text" placeholder="Enter City Name" />
            <div class="cityOptions" id="cityOptions"></div>
          </div>

          <!-- <button id="searchBtn">Search</button> -->
        </div>

        <!-- first container -->
        <div>
          <div>
            <div>
              <h2 class="headingCityName">City</h2>
              <p class="description">-</p>
            </div>

            <div>
              <h2 class="heading">Current Temperature</h2>
              <p class="headingDegree">-</p>
            </div>
          </div>
          
          <div class="weatherMainImg">
            <img class="weatherImage" width="100" height="100" src="/no-weather.png" />
          </div>
        </div>
        
        <!-- Second container  -->
        <div class="secondContainer">
          <div class="feelsLike">
            <h3>Feels Like</h3>
            <p>-</p>
          </div>

          <div class="minTemp">
            <h3>Min Temperature</h3>
            <p>-</p>
          </div>

          <div class="maxTemp">
            <h3>Max Temperature</Table></h3>
            <p>-</p>
          </div>

          <div class="humidity">
            <h3>Humidity</h3>
            <p>-</p>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="script.js"></script>
</body> 
</html>
