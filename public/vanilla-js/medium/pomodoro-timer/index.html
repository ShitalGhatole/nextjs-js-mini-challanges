<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Pomodoro Timer</title>

  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="container">
    <div class="card">

      <div class="header">
        <h1>Pomodoro Timer</h1>
        <p>Stay focused and take breaks</p>
      </div>

      <div class="timer-section">
        <div
          id="status"
          class="status paused"
        >
          ● PAUSED
        </div>

        <div id="timer" class="timer">
          25:00
        </div>

        <p
          id="sessionType"
          class="session-type work-session"
        >
          💻 Work Session
        </p>
      </div>

      <div class="stats">
        <div>
          <span>
            Completed Sessions
          </span>

          <strong id="sessionCount">
            0
          </strong>
        </div>
      </div>

      <div class="actions">
        <button
          id="startPauseBtn"
          class="start-button"
        >
          ▶ Start Timer
        </button>

        <button
          id="resetBtn"
          class="reset-button"
        >
          ↺ Reset
        </button>
      </div>

    </div>
  </div>

  <audio
    id="notificationSound"
    src="notification.mp3"
  ></audio>

  <script src="script.js"></script>

</body>
</html>
